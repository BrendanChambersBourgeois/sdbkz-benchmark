[project]
name = "sdbkz-benchmark"
version = "1.0.0"
description = "Empirical evaluation of SD-BKZ vs BKZ via the Li-Nguyen Rankin profile"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "fpylll==0.6.4",
    "cysignals==1.12.6",
    "numpy==2.4.4",
    "boto3",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
cloud = ["boto3"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["paper", "patches", "_archives", "results", "Research"]

[tool.ruff.lint]
# Conservative rule set — style-drift-catching without being
# opinionated. Raise F-codes (pyflakes: undef vars, unused imports),
# W-codes (whitespace), E-codes excluding line-length (already 100),
# and I001 (import sorting — unsorted imports are a pre-commit smell).
select = ["F", "W", "I"]
ignore = [
    "F401",   # unused import: some wrappers re-export math/numpy
    "F403",   # `from module import *` — not used but cheap to keep off
    "F405",   # may be undefined, or defined from star imports
    "I001",   # import sorting: too noisy for existing layout, opt-in later
]

[tool.ruff.lint.per-file-ignores]
# Test + confirmation scripts build inline Python source strings; keep
# lenient.
"scripts/confirm_v1_2.py" = ["E501", "F841"]
"scripts/test_math_core_parity.py" = ["E402"]
"scripts/test_log_clamp_wrappers.py" = ["E402"]
