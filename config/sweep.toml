description = "q=3329 ML-KEM modulus, 1000-bit MPFR"
inherits = "main"
q = 3329
precision = 1000
n_grid = [50, 60, 70, 80, 90, 100]
beta_grid = [30]
tours_by_beta = { "30" = 70 }
num_seeds = 100
