# Campaign definitions for scripts/run_campaign.py: one block per campaign
# naming its generator, engine, cell grid (n, beta, q), precision, tours and
# seed tree. Schema is validated by scripts/_config.py::load_campaign; a block
# may set `inherits = "<base>"` to start from another campaign's settings.
#
# Seed trees are separate per engine and per build; manifest cells are never
# re-opened by a rerun campaign, which writes its own tree. g6k campaigns need
# an image whose sieving dimension covers 2n (dim384 for n >= 129) and only
# the fplll engine accepts an mpfr measurement GSO.

config_version = 1

[default]
q = 97
precision = 250
num_seeds = 100
store_per_tour = false
generator = "lwe_kannan"

[campaigns.main]
description = "Paper main sweep, q=97 across the n×β grid"
beta_grid = [20, 30, 40]
n_grid = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150]
tours_by_beta = { "20" = 50, "30" = 70, "40" = 100 }
num_seeds = 100
store_per_tour = false

