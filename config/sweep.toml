# -- NTRU β=40 DSD-onset BOUNDARY map — q*(n) edge-tracing across the n-ladder ----
# Goal: trace the onset boundary q*(n) = the q where β=40 FIRST cracks the planted
# secret, as a function of n. NOT a dense n×q grid (days of compute, most cells are
# deep-null or deep-crack we don't care about). Instead EDGE-BISECT per n:
#   1. probe a high q (deep overstretch → near-certain crack) to confirm reachability
#   2. bisect q downward to the first-crack edge → q*(n)  (~3–4 cells/n, not 8+)
# Both --n and --q are CLI overrides (run_campaign.py:463,475), so one config drives
# the whole ladder. Same cancellation-free recovery readout → NATIVE at every dim
# (no g6k / no patched image). seed_tag default "ntru" (canonical tree). num_seeds=20
# per cell; bump --seeds near the edge if a cell sits at a low single-digit rate.
#
# n-ladder (ALL PRIME — NTRU needs f invertible in Z_q[x]/(x^n−1)); q_fat=0.004·n^2.484
# (scripts/generators/ntru.py); onset/q_fat RISES super-linearly with n, so the q
# band widens up the ladder. PRIME q at representative multiples (pick/bisect within):
#   n=157 dim=314 q_fat=1139 │ 1.9×→2179 2.2×→2521 2.5×→2851 2.8×→3191 3.1×→3533
#   n=181 dim=362 q_fat=1622 │ 1.9×→3083 2.2×→3571 2.5×→4057 2.8×→4547 3.1×→5039
#   n=211 dim=422 q_fat=2375 │ 1.9×→4513 2.2×→5227 2.5×→5939 2.8×→6653 3.1×→7369
#   n=241 dim=482 q_fat=3304 │ 1.9×→6277 2.2×→7283 2.5×→8263 2.8×→9257 3.1×→10243
#   n=271 dim=542 q_fat=4421 │ 1.9×→8419 2.2×→9733 2.5×→11057 2.8×→12379 3.1×→13709
# (regenerate for any n: prime ≥ int(q_fat·mult), q_fat=0.004·n**2.484)
# Cost climbs fast with dim: n=181≈4.7h/cell, n=211≈7–8h, n=241+ worse → climb one
# rung at a time, do NOT pre-queue the whole ladder. Find each q*(n) before the next n.
# Example (n=211 reachability probe, then bisect):
#   python3 scripts/run_campaign.py --campaign ntru_onset_boundary --n 211 --q 7369 --workers 20
#   python3 scripts/run_campaign.py --campaign ntru_onset_boundary --n 211 --q 5939 --workers 20
[campaigns.ntru_onset_boundary]
