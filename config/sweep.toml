# SD-BKZ benchmark — campaign configuration
#
# Single source of truth for the (n, β, q, precision, tours, num_seeds)
# tuples that each `scripts/run_*.py` or `scripts/sweep_*.py` runner
# currently hardcodes at module scope. Captured here for cross-script
# audit and future migration — see `docs/design_decisions.md` ADR
# (TBD) for the migration plan.
#
# Schema is validated by `scripts/_config.py::load_campaign`; unknown
# keys are rejected in strict mode so a typo can't silently land a
# wrong-precision sweep. Round-trip + schema tests live in
# `tests/test_config.py`.
#
# Out of scope for this file (per the backlog design doc):
#   - worker counts (deployment-specific)
#   - S3 buckets, output dirs, file paths (conventions)
#   - timeouts (tuning knobs)
#   - Docker image choice (CI-level)
#
# Inheritance: a campaign block may set `inherits = "<base>"` to start
# from another campaign's full settings and override individual fields.
# Cycles are rejected; depth is capped at 8 levels to bound resolution
# cost on pathological inputs.

config_version = 1

[default]
q = 97
precision = 250
num_seeds = 100
store_per_tour = false
# Lattice generator by name (see scripts/generators GENERATORS registry).
# Every existing campaign inherits this default → the historical LWE-Kannan
# construction, byte-for-byte unchanged. A campaign overrides it to route a
# different generator (e.g. "ntru") through the same engine + dispatch.
generator = "lwe_kannan"

# -- Main paper sweep -------------------------------------------------------
# q=97, β ∈ {20, 30, 40} × n ∈ {50..150 step 10}. 33 cells × 100 seeds
# = 3,300 reference seeds frozen for the paper.
[campaigns.main]
description = "Paper main sweep, q=97 across the n×β grid"
beta_grid = [20, 30, 40]
n_grid = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150]
tours_by_beta = { "20" = 50, "30" = 70, "40" = 100 }
num_seeds = 100
store_per_tour = false

# -- q=3329 ML-KEM verification --------------------------------------------
# Same n / β grid but at the ML-KEM modulus + 1000-bit MPFR. Triggered
# the §8 fplll cancellation finding. 100-seed n=100 set is the
# headline; smaller intermediate n=70/80/90 fills are archived too.
[campaigns.q3329]
description = "q=3329 ML-KEM modulus, 1000-bit MPFR"
inherits = "main"
q = 3329
precision = 1000
n_grid = [50, 60, 70, 80, 90, 100]
beta_grid = [30]
tours_by_beta = { "30" = 70 }
num_seeds = 100
store_per_tour = true

# -- β=40 cliff precision robustness ---------------------------------------
# 20-seed re-run at n=130, β=40 at 500-bit MPFR (double the main-sweep
# 250-bit) to confirm the cliff is structural rather than a precision
# artefact. Paper §6.3 cites this set explicitly.
[campaigns.cliff500]
description = "β=40 cliff precision robustness at n=130, 500-bit MPFR"
inherits = "main"
beta_grid = [40]
n_grid = [130]
precision = 500
num_seeds = 20
store_per_tour = true

# -- β=40 1000-tour convergence bracket ------------------------------------
# Eight-dimension cliff bracket extending to n=160 (v1.5.2). 20 seeds
# each at q=97, 250-bit MPFR. The cliff bottoms in the n=130–140 band
# and softens at n=150 / n=160; see paper §Limitations.
[campaigns.convergence_beta40_mt1000]
description = "β=40 1000-tour cliff bracket, q=97"
inherits = "main"
beta_grid = [40]
n_grid = [110, 120, 122, 125, 130, 140, 150, 160]
tours_by_beta = { "40" = 1000 }
num_seeds = 20
store_per_tour = true

# -- β=30 1000-tour convergence trio ---------------------------------------
# n=90 / n=140 / n=150 mt1000 (each 20 seeds). Established the
# tour-depth-dependent crossover at n=140 vs persistence at n=150 in
# the v1.5.1 §Limitations text.
[campaigns.convergence_beta30_mt1000]
description = "β=30 1000-tour convergence trio, q=97"
inherits = "main"
beta_grid = [30]
n_grid = [90, 140, 150]
tours_by_beta = { "30" = 1000 }
num_seeds = 20
store_per_tour = true

# -- 3× tours capability test -----------------------------------------------
# β=30 with 3× tour budget (BKZ @ 210, SD-BKZ @ 70). Paper §5.3
# capability gap at β≥30 finding (0/400 gaps closed).
[campaigns.tours3x]
description = "3× tour capability test, β=30 q=97"
inherits = "main"
beta_grid = [30]
n_grid = [50, 60, 70, 80]
tours_by_beta = { "30" = 210 }
num_seeds = 100
store_per_tour = false

# -- fplll version sensitivity ---------------------------------------------
# Reviewer-defensive: paper results should not depend on the specific
# fplll version inside the vendored fpylll 0.6.4 wheel. 5 seeds × 3
# versions (5.4.3 / 5.4.4 / 5.4.5) at the canonical (n=100, β=30) cell.
[campaigns.fplll_sensitivity]
description = "fplll legacy-version sensitivity at (n=100, β=30, q=97)"
inherits = "main"
beta_grid = [30]
n_grid = [100]
tours_by_beta = { "30" = 70 }
num_seeds = 5
store_per_tour = false

# -- NTRU construction smoke ------------------------------------------------
# Greenfield NTRU generator (Ducas–van Woerden: circulant Z_q[x]/(x^n−1),
# n prime, uniform-ternary σ²=2/3, 2n×2n basis). The ntru_smoke runner
# BUILDS + structurally verifies bases (dim=2n, q·I_n block, key
# consistency H·f≡g mod q) for each n∈n_grid × seed, then runs BKZ over
# the full-basis [0,2n) metric (R*) in-memory (no per-seed JSONs).
# `n` is the prime ring degree; `beta` is the smoke blocksize.
[campaigns.ntru_smoke]
description = "NTRU basis construction smoke (circulant DvW, dim=2n)"
generator = "ntru"
q = 3329
precision = 250
beta_grid = [2]
n_grid = [17, 31]
tours_by_beta = { "2" = 1 }
num_seeds = 3
store_per_tour = false

# -- NTRU pilot seed set ----------------------------------------------------
# Real NTRU seeds written to results/seeds/ntru/q{q}/p{p}_mt{mt}/n_beta/.
# Prime n {67,79} at q=97 sit BELOW the fatigue point (q≈0.004·n^2.484 is
# ≈137 / ≈207), i.e. the standard (non-overstretched) regime where BKZ
# does real blocksize-dependent work — verified non-degenerate (LLL does
# NOT solve; ~68s/seed at n=67, advantage ≈ -0.017). q=97 matches the LWE
# main sweep so the two engines are directly comparable. Scale n / β /
# seeds (or push q toward fatigue) to map the NTRU fatigue transition.
[campaigns.ntru]
description = "NTRU seed set (circulant DvW, q=97 standard regime)"
generator = "ntru"
q = 97
precision = 250
beta_grid = [20]
n_grid = [59, 61, 67, 71, 73, 79, 83, 89]
tours_by_beta = { "20" = 50 }
num_seeds = 20
store_per_tour = false

# -- NTRU fatigue q-sweep ---------------------------------------------------
# Fixed n=89 (fatigue point q≈0.004·89^2.484 ≈ 278), sweep q across it via
# `--q` override to locate the fatigue onset: standard regime (q below
# fatigue, BKZ blocksize matters) → overstretched (q above, dense sublattice
# found cheaply). precision=500 (headroom vs the q=3329 §8 cancellation;
# watch results/clamp_events.jsonl for non-positive get_r). β=20, 10 seeds.
#   for q in 97 149 211 257 307 401 547 691; do
#     run_campaign --campaign ntru_qsweep --q $q; done
[campaigns.ntru_qsweep]
description = "NTRU fatigue q-sweep at n=89 (DvW circulant)"
generator = "ntru"
q = 277
precision = 500
beta_grid = [20]
n_grid = [89]
tours_by_beta = { "20" = 50 }
num_seeds = 10
store_per_tour = false

# -- NTRU n=127 Kahan-patch rerun (paper §8 validation #2) ------------------
# Reruns the contaminated n=127 NTRU seeds under PATCHED fplll (Kahan-
# compensated GSO, patches/fplll_gso_kahan.patch) to re-prove the §8
# catastrophic-cancellation fix on a NEW modulus family vs the q=3329 LWE
# validation #1. RUN INSIDE the patched image (Dockerfile.fplll_patched →
# sdbkz-fplll-patched), sweeping q over the contaminated set via --q:
#   for q in 971 1087 1201; do run_campaign --campaign ntru_n127_patched --q $q; done
# seed_tag routes output to results/seeds/ntru_patched/ — the canonical
# results/seeds/ntru/ tree is NEVER touched. precision=1000, β=20, mt=50,
# 4 seeds = the exact params of the contaminated originals. The shared NTRU
# worker wires the get_r clamp logger, so a residual §8 clamp is recorded
# (expected: the catastrophic -345 floor is GONE under the patch).
[campaigns.ntru_n127_patched]
description = "NTRU n=127 Kahan-patched-fplll rerun (§8 validation #2)"
generator = "ntru"
seed_tag = "ntru_patched"
q = 971
precision = 1000
beta_grid = [20]
n_grid = [127]
tours_by_beta = { "20" = 50 }
num_seeds = 4
store_per_tour = false

# -- g6k engine NTRU pilot (Phase 4) ----------------------------------------
# First g6k-backend science run (both boundary gates cleared: ADR-007
# determinism, ADR-008 self-dual). Confirms the g6k full-seed pipeline via
# run_single(backend="g6k") and the g6k SD-BKZ vs BKZ signature (d(LN)/DSD
# differs while RHF ~equal — the Rowell cross-engine point). MUST RUN INSIDE
# sdbkz-g6k:ref (the fplll image has no g6k). β=40 (g6k sieving needs a
# non-trivial blocksize, unlike the fplll β=20 ntru sweep — cross-engine grid
# is a Phase-4-proper decision). precision keys the seed path only; the g6k
# sieve ignores MPFR bits. seed_tag=ntru_g6k → separate results/seeds tree.
#   docker run --rm -v "$PWD":/work -w /work sdbkz-g6k:ref \
#     python3 scripts/run_campaign.py --campaign ntru_g6k_pilot --workers 4
[campaigns.ntru_g6k_pilot]
description = "g6k-engine NTRU pilot (Phase 4: SD-BKZ vs BKZ on the sieve)"
generator = "ntru"
backend = "g6k"
seed_tag = "ntru_g6k"
q = 97
precision = 250
beta_grid = [40]
n_grid = [67]
tours_by_beta = { "40" = 10 }
num_seeds = 4
store_per_tour = false

# -- g6k RHF-blind-across-dimension run (Phase 4 (a)) ------------------------
# Confirms the paper-1 thesis cross-engine, ACROSS DIMENSION on g6k: RHF is
# blind to the SD-BKZ vs BKZ difference (rhf_bkz == rhf_sdbkz) while the
# reference-free d(LN) / Rankin profile distance sees it — at every n, not
# just the pilot cell. q=97 standard regime (advantage ~0, as for the fplll
# ntru q=97 set); the POINT is the RHF-vs-d(LN) contrast, not a large
# advantage. mt=50 (full trajectory, distinct path from the mt=10 pilot — no
# collision). β=40 (g6k needs a non-trivial sieve blocksize). Cite Rowell
# Ch3 (RHF-equal under non-exact oracle); our d(LN) measures past it.
# RUN INSIDE sdbkz-g6k:ref, 20+ workers across seeds (sieve threads=1):
#   docker run --rm -v "$PWD":/work -w /work sdbkz-g6k:ref \
#     python3 scripts/run_campaign.py --campaign ntru_g6k_rhf --workers 22
[campaigns.ntru_g6k_rhf]
description = "g6k NTRU RHF-blind vs d(LN) across dimension (Phase 4a)"
generator = "ntru"
backend = "g6k"
seed_tag = "ntru_g6k"
q = 97
precision = 250
beta_grid = [40]
n_grid = [67, 79, 89, 101, 113]
tours_by_beta = { "40" = 50 }
num_seeds = 20
store_per_tour = false

# -- fplll cross-engine match at n=89 (anomaly investigation) ----------------
# The g6k Phase-4a run surfaced a bimodal short-vector event at n=89: g6k
# SD-BKZ finds a vector below the q-floor (gs[0] 4.46->2.36) on some seeds
# (17,19) but not others (1). Is it real DSD-onset, or high-tour drift in the
# g6k self-dual construction (ADR-008 validated only 3 tours)? This runs fplll
# SD_VARIANT on the SAME 20 NTRU lattices, SAME (n=89, β=40, mt=50, q=97), so
# the seed-by-seed pattern can be compared engine-to-engine. backend=fplll
# (default); seed_tag default → results/seeds/ntru/q97/p250_mt50/n089_beta40/,
# mirroring ntru_g6k's cell for direct comparison. RUN IN sdbkz-benchmark:ci,
# 22 workers (fplll enum-40 mt=50 is heavy; parallel across the 20 seeds):
#   python3 scripts/run_campaign.py --campaign ntru_xeng_n89 --workers 22
[campaigns.ntru_xeng_n89]
description = "fplll NTRU n=89 β=40 mt=50 — cross-engine match to ntru_g6k anomaly"
generator = "ntru"
q = 97
precision = 250
beta_grid = [40]
n_grid = [89]
tours_by_beta = { "40" = 50 }
num_seeds = 20
store_per_tour = false

# -- fplll cross-engine tail (n=101/113), matches the g6k Phase-4a tail ------
# fplll SD_VARIANT at the two slow dimensions, mirroring ntru_g6k's n=101/113
# cells, so the morning has a dimension-resolved fplll-vs-g6k comparison of
# the short-vector-event pattern. Same (β=40, mt=50, q=97). RUN IN
# sdbkz-benchmark:ci. fplll enum-40 mt=50 at n=113 is heavy — may not finish
# in one night; resumable (skips existing). Compared via compare_xengine.py.
[campaigns.ntru_xeng_tail]
description = "fplll NTRU n=101/113 β=40 mt=50 — cross-engine tail match to ntru_g6k"
generator = "ntru"
q = 97
precision = 250
beta_grid = [40]
n_grid = [101, 113]
tours_by_beta = { "40" = 50 }
num_seeds = 20
store_per_tour = false

# -- g6k DSD-onset q-sweep at fixed n=89 (Phase 4b) --------------------------
# Map the g6k SD-BKZ DSD-onset by sweeping q ACROSS the NTRU fatigue point
# (q_fat(89) ≈ 0.004·89^2.484 ≈ 280) at fixed n=89, β=40, mt=50. Thesis: the
# SD-BKZ short-vector "fire" rate (gs_lognorms_sdbkz[0] below the q-floor)
# GROWS as q → fatigue and into the overstretched regime, with SD-onset at
# lower q than BKZ-onset — the reference-free DSD observable, now on the
# sieve engine. (The Phase-4a fixed-q=97 sweep across n was the WRONG axis:
# at fixed q, larger n is harder, so firing fell. q is the right
# knob.) Sweep q via --q; match the fplll precision tier per q via
# --precision (p250 for q<400, p500 for 400–899) so a future fplll β=40
# match shares the seed paths. RUN IN sdbkz-g6k:ref, 22 workers:
#   for q in 211 257 307; do run_campaign --campaign ntru_g6k_qsweep --q $q --precision 250 --workers 22; done
#   for q in 401 521;     do run_campaign --campaign ntru_g6k_qsweep --q $q --precision 500 --workers 22; done
[campaigns.ntru_g6k_qsweep]
description = "g6k NTRU DSD-onset q-sweep at n=89, β=40 (Phase 4b)"
generator = "ntru"
backend = "g6k"
seed_tag = "ntru_g6k"
q = 257
precision = 250
beta_grid = [40]
n_grid = [89]
tours_by_beta = { "40" = 50 }
num_seeds = 20
store_per_tour = false

# -- fplll β=40 DSD-onset q-sweep — matched cross-engine baseline ------------
# Same (n=89, β=40, mt=50, q-grid, DSD criterion) as ntru_g6k_qsweep, on the
# fplll enum oracle. Removes the β=20-vs-β=40 confound: the existing fplll
# NTRU q-sweep (the paper-2 DSD-onset trend) is β=20; this is β=40, so the
# g6k(sieve,β40) vs fplll(enum,β40) onset comparison is apples-to-apples.
# seed_tag default → results/seeds/ntru/q{q}/p250_mt50/n089_beta40/, the same
# cells compare_xengine.py reads against ntru_g6k. RUN IN sdbkz-benchmark:ci
# (rebuilt non-root). fplll enum-β40 mt=50 is heavy (~2h/cell) — long:
#   for q in 97 113 137 157 181 211; do run_campaign --campaign ntru_xeng_qsweep --q $q --precision 250 --workers 22; done
[campaigns.ntru_xeng_qsweep]
description = "fplll NTRU β=40 DSD-onset q-sweep at n=89 — cross-engine match"
generator = "ntru"
q = 137
precision = 250
beta_grid = [40]
n_grid = [89]
tours_by_beta = { "40" = 50 }
num_seeds = 20
store_per_tour = false

# -- NTRU n=113 β=20 DSD-onset q-sweep — trend ENDPOINT top-up ---------------
# Reconstructs the recipe for the n=113 β=20 trend cells (originals made
# 2026-06-03 via a temp block since removed; no recorded CLI command, --n is
# ignored by the ntru persist loop which iterates campaign.n_grid). seed_tag
# default → results/seeds/ntru/q{q}/p{prec}_mt50/n113_beta20/. Resumable:
# skips existing seeds, tops up to 100. PRECISION MUST LADDER BY q to match the
# existing cells exactly (else the new seeds split into a different p### dir).
# RUN on the stable host (made the originals). workers=22.
# Run slow-first (q947 p1000 = ~68min/seed sink) so the long pole starts early:
#   RUN() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work sdbkz-benchmark:ci "$@"; }
#   p1000: for q in 947 1049 1163 1279; do RUN python3 scripts/run_campaign.py --campaign ntru_n113_qsweep --q $q --precision 1000 --seeds 100 --workers 22; done
#   p500:  for q in 569 613 631 661 701 719 773 859; do RUN python3 scripts/run_campaign.py --campaign ntru_n113_qsweep --q $q --precision 500 --seeds 100 --workers 22; done
#   p250:  for q in 409 449 487 523; do RUN python3 scripts/run_campaign.py --campaign ntru_n113_qsweep --q $q --precision 250 --seeds 100 --workers 22; done
# DRY-RUN each first. --seeds works (fix ebcab5f); --beta does NOT (beta_grid sets it).
# DO NOT use --ulimit stack=-1 (β=20 enum is shallow; the flag broke OpenBLAS
# thread creation across forks -- dropped). If fork pressure ever
# recurs, the fix is per-worker thread-pinning env vars (OPENBLAS_NUM_THREADS=1
# OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1) -- byte-identity
# RE-VERIFIED safe (verify.sh, n=50 refs matched to digit). The original
# crash was the host VM init dying (p9io/dxgk), not this campaign.
# Worker isolates a single seed's PYTHON failure (logs "error:" + continues);
# a native crash kills only its worker, cell is resumable -- re-fire that q.
[campaigns.ntru_n113_qsweep]
description = "NTRU β=20 DSD-onset q-sweep at n=113 — trend endpoint top-up"
generator = "ntru"
q = 947
precision = 1000
beta_grid = [20]
n_grid = [113]
tours_by_beta = { "20" = 50 }
num_seeds = 100
store_per_tour = false

