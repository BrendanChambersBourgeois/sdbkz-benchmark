# Drop-in for forever-runner.service; install to ~/.config/systemd/user/forever-runner.service.d/
[Service]
# Filler width 20, matching the worklist lines' --workers 20 (Nice=19 in
# nice.conf keeps the host responsive at this width). Applies at the next
# unit start.
ExecStart=
ExecStart=/usr/bin/python3 scripts/forever_runner.py --filler-workers 20
