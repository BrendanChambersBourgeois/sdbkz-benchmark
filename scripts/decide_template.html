<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#dcdcd6; --acc:#1f5f8b; --ok:#1c7c3c; --warn:#b8860b; --dim:#8a8a84; --chip:#eeeee9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ececea; --muted:#9a9a94; --card:#1f1f1d; --line:#33332f; --acc:#7ab4de; --ok:#5fc27d; --warn:#e0b24a; --dim:#77776f; --chip:#2a2a27; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 1rem 6rem; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; }
  header.top { position:sticky; top:0; z-index:5; background:var(--bg); padding:1rem 0 .6rem; border-bottom:1px solid var(--line); margin-bottom:1rem; }
  h1 { font-size:1.35rem; margin:0 0 .2rem; }
  .sub { color:var(--muted); margin:0 0 .6rem; font-size:.92rem; }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  button { font:inherit; padding:.45rem .9rem; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:default; }
  .prog { color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; }
  .status { color:var(--muted); font-size:.85rem; min-width:9rem; text-align:right; }
  .chips { display:flex; flex-wrap:wrap; gap:.35rem; margin:.6rem 0 0; }
  .chip { font-size:.8rem; padding:.2rem .6rem; border-radius:999px; background:var(--chip); border:1px solid transparent; cursor:pointer; color:var(--fg); }
  .chip.on { border-color:var(--acc); color:var(--acc); }
  .chip .n { color:var(--muted); margin-left:.3rem; }
  h3.topic { font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:1.4rem 0 .5rem; }
  .q { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:.9rem 1.1rem; margin:0 0 .8rem; outline:none; }
  .q:focus-within, .q.focus { border-color:var(--acc); box-shadow:0 0 0 2px color-mix(in srgb, var(--acc) 25%, transparent); }
  .q.done { border-left-color:var(--ok); }
  .q.later { border-left-color:var(--warn); }
  .q.dismissed { border-left-color:var(--dim); opacity:.75; }
  .q.hidden { display:none; }
  .q h2 { font-size:1rem; margin:0 0 .3rem; }
  .q .ctx { color:var(--muted); font-size:.9rem; margin:0 0 .6rem; }
  .trail { display:grid; grid-template-columns:max-content 1fr; gap:.15rem .7rem; font-size:.86rem; margin:0 0 .7rem; padding:.5rem .7rem; border-left:3px solid var(--chip); }
  .trail dt { color:var(--muted); font-weight:600; }
  .trail dd { margin:0; }
  .meta { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; font-size:.75rem; color:var(--muted); margin-bottom:.3rem; }
  .badge { padding:.05rem .45rem; border-radius:4px; background:var(--chip); }
  .badge.todo { color:var(--warn); }
  .badge.ruling { color:var(--acc); }
  .banner { font-size:.82rem; color:var(--warn); margin:0 0 .5rem; }
  .opts label { display:flex; gap:.5rem; align-items:baseline; padding:.28rem .3rem; border-radius:5px; cursor:pointer; }
  .opts label:hover { background:var(--chip); }
  .opts label .k { font-size:.72rem; color:var(--muted); min-width:1.1rem; font-variant-numeric:tabular-nums; }
  .opts input { margin:0; }
  .actions { display:flex; flex-wrap:wrap; gap:.3rem 1rem; margin-top:.35rem; padding-top:.35rem; border-top:1px dashed var(--line); }
  .actions label { color:var(--muted); font-size:.9rem; }
  .other { display:flex; gap:.5rem; align-items:center; margin-top:.3rem; }
  .other input[type=text], textarea.note { font:inherit; width:100%; padding:.4rem .5rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  textarea.note { margin-top:.45rem; min-height:2.1rem; resize:vertical; }
  .ref { font-size:.8rem; color:var(--muted); margin-top:.3rem; }
  #out { width:100%; min-height:10rem; font:13px/1.4 ui-monospace, monospace; padding:.6rem; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  details { margin:1.5rem 0; }
  details summary { cursor:pointer; color:var(--muted); }
  .keys { color:var(--muted); font-size:.8rem; margin-top:.4rem; }
  kbd { font:.8em ui-monospace, monospace; padding:.05rem .3rem; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; background:var(--chip); }
  .finished { background:var(--card); border:1px solid var(--ok); border-radius:8px; padding:1rem 1.1rem; margin:1rem 0; }
  .empty { color:var(--muted); padding:2rem 0; text-align:center; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 id="title">Decisions</h1>
    <p class="sub" id="subtitle"></p>
    <div class="bar">
      <button class="primary" id="finish">Finish and save</button>
      <button id="copy">Copy as markdown</button>
      <button id="download">Download answers</button>
      <button id="reset">Clear</button>
      <span class="status" id="status"></span>
      <span class="prog" id="prog"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> next/previous · <kbd>1</kbd>–<kbd>9</kbd> pick · <kbd>l</kbd> later · <kbd>d</kbd> dismiss · <kbd>o</kbd> other · <kbd>n</kbd> note · <kbd>u</kbd> unanswered only</div>
  </header>
  <div id="finished"></div>
  <div id="list"></div>
  <details>
    <summary>Results as markdown</summary>
    <textarea id="out" readonly></textarea>
  </details>
</main>

<script type="application/json" id="questions">
{"title":"Decisions","subtitle":"","mode":"static","questions":[]}
</script>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const set = JSON.parse($('#questions').textContent);
  const served = set.mode === 'served' && location.protocol.startsWith('http');
  const key = 'decide:' + (set.title || 'untitled');
  let answers = {};
  let filter = { topic: null, open: false };
  let focusIdx = 0;
  let saveTimer = null;
  let finished = false;

  // Pending answers from the server win over the browser copy: they are what
  // the last session autosaved, and a static build has none.
  function load() {
    try { answers = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { answers = {}; }
    // Stored answers for questions no longer on the page are stale (answered or
    // dismissed in an earlier run under the same title): drop them.
    const ids = new Set(set.questions.map(q => q.id));
    Object.keys(answers).forEach(id => { if (!ids.has(id)) delete answers[id]; });
    set.questions.forEach(q => { if (q.pending) answers[q.id] = { choice: q.pending.choice, other: q.pending.other || '', note: q.pending.note || '' }; });
  }
  function persist() {
    try { localStorage.setItem(key, JSON.stringify(answers)); } catch (e) {}
    if (served && !finished) {
      clearTimeout(saveTimer);
      $('#status').textContent = 'saving…';
      saveTimer = setTimeout(async () => {
        try {
          const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) });
          const j = await r.json();
          $('#status').textContent = 'saved ' + (j.ts || '').slice(11);
        } catch (e) { $('#status').textContent = 'save failed, answers kept in this browser'; }
      }, 400);
    }
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function stateOf(a) { if (!a || !a.choice) return ''; if (a.choice === '__later') return 'later'; if (a.choice === '__dismiss') return 'dismissed'; return 'done'; }

  function topics() {
    const m = new Map();
    set.questions.forEach(q => { const t = q.topic || 'General'; m.set(t, (m.get(t) || 0) + 1); });
    return [...m.entries()];
  }

  function renderChips() {
    const c = $('#chips');
    c.innerHTML = '';
    const all = document.createElement('span');
    all.className = 'chip' + (filter.topic === null ? ' on' : '');
    all.innerHTML = `All<span class="n">${set.questions.length}</span>`;
    all.onclick = () => { filter.topic = null; render(); };
    c.appendChild(all);
    topics().forEach(([t, n]) => {
      const s = document.createElement('span');
      s.className = 'chip' + (filter.topic === t ? ' on' : '');
      s.innerHTML = `${esc(t)}<span class="n">${n}</span>`;
      s.onclick = () => { filter.topic = filter.topic === t ? null : t; render(); };
      c.appendChild(s);
    });
    const u = document.createElement('span');
    u.className = 'chip' + (filter.open ? ' on' : '');
    u.textContent = 'unanswered only';
    u.onclick = () => { filter.open = !filter.open; render(); };
    c.appendChild(u);
  }

  function render() {
    $('#title').textContent = set.title || 'Decisions';
    $('#subtitle').textContent = set.subtitle || '';
    document.title = set.title || 'Decisions';
    renderChips();
    const list = $('#list');
    list.innerHTML = '';
    if (!set.questions.length) { list.innerHTML = '<p class="empty">Nothing is waiting on you.</p>'; update(); return; }
    let lastTopic = null;
    set.questions.forEach((q, i) => {
      const a = answers[q.id] || {};
      const t = q.topic || 'General';
      const hidden = (filter.topic && filter.topic !== t) || (filter.open && stateOf(a));
      if (t !== lastTopic && !hidden) {
        const h = document.createElement('h3'); h.className = 'topic'; h.textContent = t; list.appendChild(h); lastTopic = t;
      }
      const box = document.createElement('section');
      box.className = 'q ' + stateOf(a) + (hidden ? ' hidden' : '') + (i === focusIdx ? ' focus' : '');
      box.dataset.id = q.id; box.dataset.idx = i; box.tabIndex = -1;
      const opts = (q.opts || []).map((o, j) =>
        `<label><span class="k">${j + 1}</span><input type="radio" name="${q.id}" value="${esc(o)}" ${a.choice === o ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('');
      box.innerHTML = `
        <div class="meta"><span>${esc(q.id)}</span><span class="badge ${esc(q.kind)}">${q.kind === 'todo' ? 'yours to do' : 'ruling'}</span>${q.asked ? `<span>asked ${esc(q.asked)}</span>` : ''}</div>
        ${q.resurfaced ? `<p class="banner">Dismissed ${esc(q.resurfaced)}, the context has changed since, asked once more.</p>` : ''}
        <h2>${esc(q.q)}</h2>
        ${q.ctx ? `<p class="ctx">${esc(q.ctx)}</p>` : ''}
        ${(q.investigated || q.tried || q.why_you) ? `<dl class="trail">
          ${q.investigated ? `<dt>Investigated</dt><dd>${esc(q.investigated)}</dd>` : ''}
          ${q.tried ? `<dt>Tried</dt><dd>${esc(q.tried)}</dd>` : ''}
          ${q.why_you ? `<dt>Why you</dt><dd>${esc(q.why_you)}</dd>` : ''}
        </dl>` : ''}
        <div class="opts">${opts}
          <div class="other"><label><span class="k">o</span><input type="radio" name="${q.id}" value="__other" ${a.choice === '__other' ? 'checked' : ''}><span>Other</span></label>
          <input type="text" data-other placeholder="say what" value="${esc(a.other || '')}"></div>
          <div class="actions">
            <label><input type="radio" name="${q.id}" value="__later" ${a.choice === '__later' ? 'checked' : ''}> Later, ask me next time</label>
            <label><input type="radio" name="${q.id}" value="__dismiss" ${a.choice === '__dismiss' ? 'checked' : ''}> Dismiss, not doing this, stop asking</label>
          </div>
        </div>
        <textarea class="note" data-note placeholder="note (optional)">${esc(a.note || '')}</textarea>
        ${q.ref ? `<div class="ref">${esc(q.ref)}</div>` : ''}`;
      box.addEventListener('focusin', () => { focusIdx = i; document.querySelectorAll('.q.focus').forEach(b => b.classList.remove('focus')); box.classList.add('focus'); });
      list.appendChild(box);
    });
    update();
  }

  function collect() {
    document.querySelectorAll('.q').forEach(box => {
      const id = box.dataset.id;
      const r = box.querySelector('input[type=radio]:checked');
      const a = answers[id] || {};
      a.choice = r ? r.value : '';
      a.other = box.querySelector('[data-other]').value.trim();
      a.note = box.querySelector('[data-note]').value.trim();
      answers[id] = a;
      box.className = box.className.replace(/\b(done|later|dismissed)\b/g, '').replace(/\s+/g, ' ');
      const s = stateOf(a); if (s) box.classList.add(s);
    });
    persist();
  }

  function label(a) {
    if (!a || !a.choice) return '';
    if (a.choice === '__later') return 'Later';
    if (a.choice === '__dismiss') return 'Dismissed';
    if (a.choice === '__other') return a.other || 'Other (blank)';
    return a.choice;
  }

  function markdown() {
    const lines = [`## ${set.title || 'Decisions'} (${new Date().toISOString().slice(0, 16).replace('T', ' ')})`, ''];
    let n = 0;
    set.questions.forEach(q => {
      const a = answers[q.id] || {};
      const ans = label(a);
      if (!ans) return;
      n++;
      lines.push(`- **${q.id} ${q.topic || ''}** ${q.q} → **${ans}**${a.note ? ' *(' + a.note + ')*' : ''}`);
    });
    const open = set.questions.filter(q => !label(answers[q.id])).map(q => q.id);
    if (open.length) lines.push('', `Unanswered: ${open.join(', ')}`);
    return { text: lines.join('\n'), n };
  }

  function update() {
    collect();
    const m = markdown();
    $('#out').value = m.text;
    $('#prog').textContent = `${m.n} / ${set.questions.length}`;
    $('#finish').disabled = finished || m.n === 0;
  }

  $('#list').addEventListener('input', update);
  $('#list').addEventListener('change', update);

  $('#copy').addEventListener('click', async () => {
    update();
    const t = $('#out').value;
    try { await navigator.clipboard.writeText(t); $('#copy').textContent = 'Copied'; }
    catch (e) { $('#out').select(); document.execCommand('copy'); $('#copy').textContent = 'Copied (select fallback)'; }
    setTimeout(() => $('#copy').textContent = 'Copy as markdown', 1500);
  });

  $('#download').addEventListener('click', () => {
    update();
    const kept = {};
    Object.entries(answers).forEach(([id, a]) => { if (a.choice) kept[id] = a; });
    const blob = new Blob([JSON.stringify({ title: set.title, exported: new Date().toISOString(), answers: kept }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'decide-answers-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#reset').addEventListener('click', () => {
    if (!confirm('Clear every answer on this page?')) return;
    answers = {}; persist(); render();
  });

  $('#finish').addEventListener('click', async () => {
    update();
    const m = markdown();
    const open = set.questions.length - m.n;
    if (open && !confirm(`${open} unanswered, they stay open and are asked next time. Finish?`)) return;
    if (!served) {
      alert('This is the static page: use Download answers, then `decide.py import` on the file. Finish only works when served by `decide.py ask`.');
      return;
    }
    $('#finish').disabled = true; $('#status').textContent = 'committing…';
    try {
      const r = await fetch('/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) });
      const j = await r.json();
      finished = true;
      $('#status').textContent = 'committed';
      $('#finished').innerHTML = `<div class="finished"><strong>Saved.</strong> ${j.answered} answered, ${j.dismissed} dismissed, ${j.later} later. Written to the ledger, today's day note and HESTA/_Decisions.md. The local server has stopped; this tab can close.</div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      try { localStorage.removeItem(key); } catch (e) {}
    } catch (e) {
      $('#status').textContent = 'commit failed: ' + e.message + ' (answers are still autosaved, run decide.py finish)';
      $('#finish').disabled = false;
    }
  });

  // Keyboard: card-scoped so the numbers pick options on the focused card only.
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || (tag === 'input' && e.target.type === 'text')) { if (e.key === 'Escape') e.target.blur(); return; }
    const cards = [...document.querySelectorAll('.q:not(.hidden)')];
    if (!cards.length) return;
    let cur = cards.findIndex(c => +c.dataset.idx === focusIdx);
    if (cur < 0) cur = 0;
    const card = cards[cur];
    const go = (n) => { const c = cards[Math.max(0, Math.min(cards.length - 1, n))]; focusIdx = +c.dataset.idx; c.focus(); c.scrollIntoView({ block: 'center', behavior: 'smooth' }); document.querySelectorAll('.q.focus').forEach(b => b.classList.remove('focus')); c.classList.add('focus'); };
    const pick = (v) => { const r = card.querySelector(`input[type=radio][value="${CSS.escape(v)}"]`); if (r) { r.checked = true; update(); } };
    if (e.key === 'j') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'k') { go(cur - 1); e.preventDefault(); }
    else if (/^[1-9]$/.test(e.key)) { const r = card.querySelectorAll('.opts > label input[type=radio]')[+e.key - 1]; if (r) { r.checked = true; update(); go(cur + 1); } }
    else if (e.key === 'l') { pick('__later'); go(cur + 1); }
    else if (e.key === 'd') { pick('__dismiss'); go(cur + 1); }
    else if (e.key === 'o') { pick('__other'); card.querySelector('[data-other]').focus(); e.preventDefault(); }
    else if (e.key === 'n') { card.querySelector('[data-note]').focus(); e.preventDefault(); }
    else if (e.key === 'u') { filter.open = !filter.open; render(); }
  });

  load(); render();
  const first = document.querySelector('.q:not(.hidden)'); if (first) { focusIdx = +first.dataset.idx; first.classList.add('focus'); }
})();
</script>
</body>
</html>
