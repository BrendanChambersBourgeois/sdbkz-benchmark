# Pass HOST_UID + HOST_GID through to the build so the container's
# runtime user matches the host invoker — bind-mounted ./results +
# ./logs receive host-owned files instead of root-owned ones (backlog
# backlog/2026-04-20_v3_dockerfile_scope.md §8;
# Incident #32 recurrence pattern). Defaults match a typical Linux
# desktop; expanded from `${UID:-1000}`/`${GID:-1000}` so a Linux user
# on a non-1000 UID, or a WSL user, can override via shell env.

x-build: &build
  context: .
  args:
    HOST_UID: "${UID:-1000}"
    HOST_GID: "${GID:-1000}"

services:
  sweep:
    build: *build
    volumes:
      - ./results:/experiment/results
      - ./logs:/experiment/logs
    command: ["python3", "scripts/sweep_parallel.py"]
    # No CPU limit — the wrapper scripts (sweep_parallel.py,
    # run_q3329_n100_local.py, etc.) already control parallelism via
    # their --workers flag. A hardcoded `cpus: "22"` here was specific
    # to Brendan's 13900K and broke on collaborator machines with
    # fewer than 22 logical CPUs (Docker rejects the value at run
    # time with "range of CPUs is from 0.01 to N.00").

  verify:
    build: *build
    volumes:
      - ./results:/experiment/results
      - ./logs:/experiment/logs
    command: ["bash", "scripts/verify.sh"]
