name: Docker build & verify

# Continuous verification of the reproducibility chain:
#   1. Docker image builds cleanly from a fresh checkout
#      → catches infrastructure rot (stale apt pins, stale COPY
#        paths, stale BASE dirname bugs, broken docker-compose
#        settings) the moment a bad commit lands.
#
#   2. All scripts import cleanly inside the image
#      → catches syntax errors, stale path imports, missing deps.
#
#   3. verify.sh regenerates the 5 reference seeds from scratch and
#      compares them against the hardcoded reference values in the
#      script itself (tolerance 0.0001 on bkz_final_dln / sdbkz_final_dln
#      / advantage)
#      → catches any numerical reproducibility regression.
#
# Initially triggered manually via workflow_dispatch. Once the first
# run is green, flip the commented-out `push:` / `pull_request:` triggers
# on and every commit to main will be validated automatically.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight build when a newer commit on the same ref lands,
# so a rapid push cluster doesn't queue up redundant ~8-minute Docker
# regen jobs. main + PR refs each get their own group.
concurrency:
  group: build-and-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Action versions are pinned to Node 24-native majors:
    #   actions/checkout@v5            (Node 24)
    #   docker/setup-buildx-action@v4  (Node 24)
    #   docker/build-push-action@v6    (Node 24)
    # GHA forced Node 24 default 2026-06-02; Node 20 removed 2026-09-16.
    # The earlier FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 env shim is no
    # longer needed and has been removed (audit doc
    # /mnt/hgfs/Research/backlog/_shipped/2026-04-20_tool_audit_followup.md
    # MEDIUM #5 closed by version bump).

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Capture runner UID/GID for non-root image build
        id: runner_ids
        run: |
          # The image bakes a non-root user matching the runner so that
          # bind-mounted ${{ github.workspace }} files inside containers
          # are readable + writable without root-owned drift on the
          # host filesystem. github.workspace is owned by the `runner`
          # user (typically UID 1001 on ubuntu-latest), but we resolve
          # it dynamically rather than hardcode in case GHA bumps.
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build image (with GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          tags: sdbkz-benchmark:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HOST_UID=${{ steps.runner_ids.outputs.uid }}
            HOST_GID=${{ steps.runner_ids.outputs.gid }}

      - name: Lint centralised logging coverage (CLAUDE.md §16)
        run: |
          # Every entry-point script under scripts/ and analysis/ must
          # import scripts/log.py:get_logger so its events flow to
          # logs/pipeline.jsonl. Library files (no main entry) are
          # auto-exempt; everything else must be wired.
          python3 scripts/lint_logging.py

      - name: Guard — no un-allowlisted new top-level directories (INC-39)
        run: |
          # Refuses any push that introduces a top-level directory not
          # in the ALLOWED_TOP_LEVEL set in the script. Public-vs-internal
          # boundary check — the local pre-commit hook catches this on
          # the author's machine, and this CI step catches the case
          # where the author bypassed or did not install the hook
          # (postmortem action item #2 from INC-39, 2026-04-25).
          # Compare against the merge base with main; on push to main,
          # github.event.before is the previous tip.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/check_new_top_level_dirs.py "$BASE" || \
            (echo "::error::New top-level directory rejected. See script output above." && exit 1)

      - name: Lint (ruff) — style + dead-import drift guard
        run: |
          # Config in pyproject.toml [tool.ruff]; conservative rule set
          # (F-codes, W-codes, I001 disabled for now). Dev machines
          # without ruff can `pip install --user --break-system-packages
          # ruff` or run inside a venv; CI installs fresh each build.
          python3 -m pip install --upgrade ruff
          ruff check scripts/ analysis/

      - name: Type check (mypy --strict) — numerical core modules
        run: |
          # Strict mypy is gated only on the four numerical-core files
          # the paper's SHA-256 reproducibility chain pivots on; see
          # pyproject.toml [tool.mypy]. Wider coverage is intentionally
          # deferred — `feedback_type_hints_opportunistic.md` documents
          # the on-touch policy for the rest of the tree.
          python3 -m pip install --upgrade mypy
          python3 -m mypy

      - name: Coverage gate (pytest --cov) — 75% floor on numerical core
        run: |
          # Coverage targets pinned in pyproject.toml [tool.coverage.run]
          # cover scripts/_math_core.py + _bkz_core.py + _signal_utils.py
          # only. The 75% floor is the Phase 4 task spec; current
          # tree sits at ~96%. Analysis/ and experimental scripts are
          # intentionally out of scope per the task plan.
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            sdbkz-benchmark:ci \
            sh -c 'python3 -m pip install --quiet pytest-cov &&
                   python3 -m pytest tests/ --cov --cov-fail-under=75'

      - name: Unit tests (pytest) — fast edge-case coverage
        run: |
          # tests/ covers _math_core + _bkz_core corner cases, manifest
          # walker (v1.3 native + legacy), seed-path parity, lint-manifest
          # invariants, and analysis data-loader dual-mode. Run inside
          # sdbkz-benchmark:ci because several tests import analysis._data,
          # which transitively imports matplotlib/numpy/scipy (all pinned
          # in the image). Host runner only ships pytest, so a host-side
          # invocation would die with ModuleNotFoundError at collection
          # (this is the regression that broke build #71).
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            sdbkz-benchmark:ci \
            python3 -m pytest tests/ -v

      - name: Smoke-test script imports inside the image
        run: |
          docker run --rm sdbkz-benchmark:ci python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import sweep_parallel
          import sweep_cloud
          import q3329_verify
          import overnight_experiments
          import run_3x_extended
          import run_convergence_test
          print('all script imports OK')
          "

      - name: Run verify.sh with NUM_SEEDS=1 (numerical reproducibility check)
        run: |
          # Regenerate 1 n=50 β=20 reference seed from scratch inside
          # the container (the image has no results/ directory so the
          # existing file will not be found) and compare it against the
          # hardcoded reference value in verify.sh. Tolerance 0.0001 on
          # bkz_final_dln, sdbkz_final_dln, advantage.
          #
          # Why 1 seed not 5: CI is a tripwire that fires on ANY
          # numerical divergence. 1 seed is sufficient to catch every
          # failure mode that matters (Dockerfile rot, import breakage,
          # numerical regression, cross-vendor FP drift). The "5 seeds
          # is more convincing" argument applies to the one-time
          # hash_verification.txt artifact, not to per-commit CI. Saves
          # ~10 minutes of runner time per run.
          docker run --rm -e NUM_SEEDS=1 sdbkz-benchmark:ci bash scripts/verify.sh

      - name: Validate committed seed files (schema + integrity)
        run: |
          # Runs validate_seeds.py in --strict mode across the v1.3
          # campaign tree. Catches: invalid JSON, missing schema keys,
          # incomplete status, filename/content mismatch, non-finite
          # advantages, within-dataset duplicates, and SHA-256 spot-check
          # against 3 reference seeds. Mount the checkout so committed
          # seed files are visible inside the container.
          #
          # v2.0.0: pre-drop the step iterated 5+1 legacy top-level dirs
          # (results/raw, results/cloud, results/q3329, ...) that were
          # symlinks into the v1.3 tree. The destructive `rm -rf` step
          # deleted those legacy dirs and the crosswalk CSV
          # (results/seed_path_crosswalk.csv) is the permanent old→new
          # reconciler. Validation now walks the campaign tree directly.
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --strict --sha-check \
            results/seeds/main/ results/seeds/q3329/ \
            results/seeds/cliff500/ results/seeds/convergence/ \
            results/seeds/fplll_sensitivity/
          # tours3x: non-strict (legacy duplicate warnings carried over
          # from the pre-v1.3 pilot seeds co-existing with extended seeds
          # at the same (n, β, seed); preserved offline at
          # results/seeds/tours3x/ alongside the pilot manifest entries).
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --sha-check results/seeds/tours3x/

      - name: Paper figure parity gate (paper1/fig*.png + paper1/latex/figs/ ↔ analysis/figures/)
        run: |
          # Enforces byte-identity of BOTH paper figure channels with the
          # canonical analysis/figures/<source>.png mapping declared in
          # paper1/figs_source_map.json:
          #   - HTML bundle  paper1/fig{N}_<name>.png   ("pairs")
          #   - LaTeX build  paper1/latex/figs/figNN.png ("latex_pairs")
          # Catches the silent drift discovered during 2026-04-25 audit
          # follow-up (11 of 12 HTML figures out of parity since the
          # variance-fill SHA refresh in commit a34122e) AND the LaTeX
          # blind spot found 2026-06-02 (paper1/latex/figs/ was a frozen
          # 2026-04-14 export outside this gate that diverged through the
          # variance-fill — the C1 LaTeX-channel contradiction). Both
          # channels now share one gated source; the gate guards both.
          # Mounting the workspace read-only because the script never
          # writes in --check mode.
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            sdbkz-benchmark:ci python3 scripts/sync_paper_figures.py --check

      - name: Figure SHA-256 byte-identity gate (paper-safety invariant)
        run: |
          # Regenerates every paper figure inside the pinned container
          # and compares the output SHA-256 set against the baseline
          # committed at analysis/figures/.sha256. Any non-empty diff
          # means a figure has drifted — either the dataset changed
          # under it or the rendering did. Either is a blocker.
          #
          # Baseline regenerated pre-tag locally; see Makefile `figs`
          # target or CONTRIBUTING "Testing expectations" section.
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            sdbkz-benchmark:ci bash -c "
              mkdir -p /tmp/figs
              python3 analysis/paper_figures.py --output-dir /tmp/figs
              cd /tmp/figs
              sha256sum *.png | sort -k2 > /tmp/actual.sha256
              diff /repo/analysis/figures/.sha256 /tmp/actual.sha256
            "

      - name: Seed manifest lint (v1.3 integrity gate, --sha-check)
        run: |
          # Enforces the three manifest invariants:
          #   (a) no orphan files under results/seeds/ missing from
          #       seed_manifest.json,
          #   (b) no ghost manifest entries pointing at absent files,
          #   (c) on-disk SHA-256 matches the manifest record.
          # --sha-check adds invariant (c). Measured ~0.3s on 4,432
          # entries on this host's NVMe; well within CI budget.
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/lint_seed_manifest.py --sha-check

      - name: Diagnostic banner on failure
        if: failure()
        run: |
          echo "::error::Build or verification failed."
          echo ""
          echo "This usually means one of:"
          echo "  - a Dockerfile change broke the build environment"
          echo "  - a Python script change broke imports"
          echo "  - a code change shifted numerical output"
          echo "    (SHA-256 reproducibility regression)"
          echo "  - an apt package revision was garbage-collected"
          echo "    from Debian mirrors"
          echo ""
          echo "Check the earlier job steps for the specific error."

  # ---------------------------------------------------------------------------
  # G6K determinism path (ADR-005). SEPARATE job so its pending-reference
  # state cannot mask the fplll regression proof above — the two engines'
  # byte-identity gates are independent by design. This job source-builds the
  # single-threaded G6K sieve image and runs its SHA gate; it does NOT touch
  # the fplll path. The reference SHA (cf22519d… / d4faf05a…, n=80 β=60
  # seed=42) is captured and committed (Phase 1 done), so this is now a HARD
  # byte-identity gate: the lint runs with --require-ref and verify_g6k.sh
  # must exit 0 (PENDING/exit 4 can no longer occur). This is the de-facto
  # cross-machine reference test — the GitHub runner is a third machine vs
  # the single-machine capture host (ADR-005 cross-machine open item).
  g6k-build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Capture runner UID/GID for non-root image build
        id: runner_ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build G6K image (source-build fplll → fpylll → g6k, x86-64-v3)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile.g6k
          tags: sdbkz-g6k:ci
          load: true
          cache-from: type=gha,scope=g6k
          cache-to: type=gha,mode=max,scope=g6k
          build-args: |
            HOST_UID=${{ steps.runner_ids.outputs.uid }}
            HOST_GID=${{ steps.runner_ids.outputs.gid }}

      - name: G6K manifest lint (contract / ghost / separation invariants)
        run: |
          # Enforces threads==1 contract, fplll-manifest disjointness, and
          # (vacuously until Phase 4 seeds) ghost/drift. Host python is fine —
          # the lint reads JSON only, no g6k import. --require-ref: the
          # canonical reference SHA is committed (Phase 1 done), so a manifest
          # that reverts to the PENDING sentinel is now a hard failure.
          python3 scripts/lint_g6k_manifest.py --require-ref

      - name: G6K determinism verify (single-threaded SHA gate)
        run: |
          # Regenerate the reference probe inside the pinned image and SHA-
          # compare. The reference is captured (Phase 1 done), so this is a
          # HARD byte-identity gate: only exit 0 passes. PENDING (exit 4) can
          # no longer occur with a filled reference and, if it somehow does,
          # is treated as a failure alongside SHA drift (exit 1).
          docker run --rm sdbkz-g6k:ci bash scripts/verify_g6k.sh

      - name: G6K diagnostic banner on failure
        if: failure()
        run: |
          echo "::error::G6K build or determinism verify failed."
          echo "  - threads>1 anywhere is a contract violation (Phase 0)."
          echo "  - SHA drift means the x86-64-v3 build is not bit-identical."
          echo "  - check Dockerfile.g6k pins (fplll 1987472 / fpylll e25ade8 / g6k c71e084)."
