name: Docker build & verify

# Builds the pinned image from a fresh checkout, runs the lints and tests,
# regenerates one reference seed and checks every committed seed, figure and
# manifest. The G6K engine has its own job so the two byte-identity gates
# stay independent.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-and-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Capture runner UID/GID for the non-root image user
        id: runner_ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build image (with GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          tags: sdbkz-benchmark:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HOST_UID=${{ steps.runner_ids.outputs.uid }}
            HOST_GID=${{ steps.runner_ids.outputs.gid }}

      - name: Lint centralised logging coverage
        run: python3 scripts/lint_logging.py

      - name: Guard — no un-allowlisted new top-level directories
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/check_new_top_level_dirs.py "$BASE" || \
            (echo "::error::New top-level directory rejected. See script output above." && exit 1)

      - name: Lint (ruff)
        run: |
          python3 -m pip install ruff==0.15.11
          ruff check scripts/ analysis/

      - name: Type check (mypy --strict on the numerical core)
        run: |
          python3 -m pip install mypy==2.1.0
          python3 -m mypy

      - name: Coverage gate (75% floor on the numerical core)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            sdbkz-benchmark:ci \
            sh -c 'python3 -m pip install --quiet pytest-cov==7.1.0 &&
                   python3 -m pytest tests/ --cov --cov-fail-under=75'

      - name: Unit tests (inside the image; the host has no pinned numerical stack)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            sdbkz-benchmark:ci \
            python3 -m pytest tests/ -v

      - name: Smoke-test script imports inside the image
        run: |
          docker run --rm sdbkz-benchmark:ci python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import sweep_parallel
          import q3329_verify
          import run_3x_extended
          import run_convergence_test
          print('all script imports OK')
          "

      - name: Regenerate one reference seed and compare (verify.sh)
        run: docker run --rm -e NUM_SEEDS=1 sdbkz-benchmark:ci bash scripts/verify.sh

      - name: Validate committed seed files (schema + SHA spot check)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --strict --sha-check \
            results/seeds/main/ results/seeds/q3329/ \
            results/seeds/cliff500/ results/seeds/convergence/ \
            results/seeds/fplll_sensitivity/ \
            results/seeds/ntru_g6k/ results/seeds/ntru_g6k_vecprobe/ \
            results/seeds/ntru_g6k_diag/ \
            results/seeds/ntru/ results/seeds/ntru_patched/ \
            results/seeds/ntru_patched_kahan_v3/ \
            results/seeds/ntru_b2/ results/seeds/ntru_b2_probe/ \
            results/seeds/ntru_exact/ results/seeds/ntru_g6k_exact/ \
            results/seeds/ntru_g6k_reject/ \
            results/seeds/q3329_kahan/ results/seeds/q3329_control/ \
            results/seeds/q3329_mpfr/
          # tours3x is non-strict: pilot and extended seeds share (n, beta, seed).
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --sha-check results/seeds/tours3x/

      - name: Paper figure parity gate (paper1 figures ↔ analysis/figures/)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            sdbkz-benchmark:ci python3 scripts/sync_paper_figures.py --check

      - name: Figure SHA-256 byte-identity gate
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            sdbkz-benchmark:ci bash -c "
              mkdir -p /tmp/figs
              python3 analysis/paper_figures.py --output-dir /tmp/figs
              cd /tmp/figs
              sha256sum *.png | sort -k2 > /tmp/actual.sha256
              diff /repo/analysis/figures/.sha256 /tmp/actual.sha256
            "

      - name: Seed manifest lint (--sha-check)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/lint_seed_manifest.py --sha-check

      - name: Diagnostic banner on failure
        if: failure()
        run: |
          echo "::error::Build or verification failed: Dockerfile rot, import breakage, a numerical shift, or an apt revision gone from the mirrors. Check the failing step."

  # G6K determinism path (ADR-005): separate job, hard byte-identity gate.
  # Build target is x86-64-v2 with --disable-native; an AVX2 build SIGILLs
  # on v2-only runners and changes the reference SHA.
  g6k-build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Capture runner UID/GID for the non-root image user
        id: runner_ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build G6K image (source-build fplll → fpylll → g6k, x86-64-v2)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile.g6k
          tags: sdbkz-g6k:ci
          load: true
          cache-from: type=gha,scope=g6k-v2-1
          cache-to: type=gha,mode=max,scope=g6k-v2-1
          build-args: |
            HOST_UID=${{ steps.runner_ids.outputs.uid }}
            HOST_GID=${{ steps.runner_ids.outputs.gid }}

      - name: G6K manifest lint (threads==1 contract, disjointness, reference present)
        run: python3 scripts/lint_g6k_manifest.py --require-ref

      - name: G6K determinism verify (single-threaded SHA gate)
        run: docker run --rm sdbkz-g6k:ci bash scripts/verify_g6k.sh

      - name: G6K sieve trace leaves the reduction unchanged
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-g6k:ci python3 -m pytest -q -p no:cacheprovider \
            tests/test_sieve_trace_g6k.py

      - name: G6K diagnostic banner on failure
        if: failure()
        run: |
          echo "::error::G6K build or determinism verify failed."
          echo "  - threads>1 anywhere is a contract violation."
          echo "  - SHA drift means the x86-64-v2 build is not bit-identical."
          echo "  - check Dockerfile.g6k pins (fplll 1987472 / fpylll e25ade8 / g6k c71e084)."
