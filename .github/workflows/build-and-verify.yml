name: Docker build & verify

# Continuous verification of the reproducibility chain:
#   1. Docker image builds cleanly from a fresh checkout
#      → catches infrastructure rot (stale apt pins, stale COPY
#        paths, stale BASE dirname bugs, broken docker-compose
#        settings) the moment a bad commit lands.
#
#   2. All scripts import cleanly inside the image
#      → catches syntax errors, stale path imports, missing deps.
#
#   3. verify.sh regenerates the 5 reference seeds from scratch and
#      compares them against the hardcoded reference values in the
#      script itself (tolerance 0.0001 on bkz_final_dln / sdbkz_final_dln
#      / advantage)
#      → catches any numerical reproducibility regression.
#
# Initially triggered manually via workflow_dispatch. Once the first
# run is green, flip the commented-out `push:` / `pull_request:` triggers
# on and every commit to main will be validated automatically.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Silences Node 20 deprecation warnings on actions/checkout@v4,
      # docker/setup-buildx-action@v3, docker/build-push-action@v5. GHA
      # forces Node 24 by default 2026-06-02; Node 20 removed 2026-09-16.
      # Action version bumps (checkout@v5, buildx@v4 if exists,
      # build-push-action@v6) deferred — verify availability before
      # bumping to avoid mid-sweep CI breakage.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Capture runner UID/GID for non-root image build
        id: runner_ids
        run: |
          # The image bakes a non-root user matching the runner so that
          # bind-mounted ${{ github.workspace }} files inside containers
          # are readable + writable without root-owned drift on the
          # host filesystem. github.workspace is owned by the `runner`
          # user (typically UID 1001 on ubuntu-latest), but we resolve
          # it dynamically rather than hardcode in case GHA bumps.
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build image (with GHA layer cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: sdbkz-benchmark:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HOST_UID=${{ steps.runner_ids.outputs.uid }}
            HOST_GID=${{ steps.runner_ids.outputs.gid }}

      - name: Lint centralised logging coverage (CLAUDE.md §16)
        run: |
          # Every entry-point script under scripts/ and analysis/ must
          # import scripts/log.py:get_logger so its events flow to
          # logs/pipeline.jsonl. Library files (no main entry) are
          # auto-exempt; everything else must be wired.
          python3 scripts/lint_logging.py

      - name: Guard — no un-allowlisted new top-level directories (INC-39)
        run: |
          # Refuses any push that introduces a top-level directory not
          # in the ALLOWED_TOP_LEVEL set in the script. Public-vs-internal
          # boundary check — the local pre-commit hook catches this on
          # the author's machine, and this CI step catches the case
          # where the author bypassed or did not install the hook
          # (postmortem action item #2 from INC-39, 2026-04-25).
          # Compare against the merge base with main; on push to main,
          # github.event.before is the previous tip.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/check_new_top_level_dirs.py "$BASE" || \
            (echo "::error::New top-level directory rejected. See script output above." && exit 1)

      - name: Lint (ruff) — style + dead-import drift guard
        run: |
          # Config in pyproject.toml [tool.ruff]; conservative rule set
          # (F-codes, W-codes, I001 disabled for now). Dev machines
          # without ruff can `pip install --user --break-system-packages
          # ruff` or run inside a venv; CI installs fresh each build.
          python3 -m pip install --upgrade ruff
          ruff check scripts/ analysis/

      - name: Unit tests (pytest) — fast edge-case coverage
        run: |
          # tests/ covers _math_core + _bkz_core corner cases, manifest
          # walker (v1.3 native + legacy), seed-path parity, lint-manifest
          # invariants, and analysis data-loader dual-mode. Run inside
          # sdbkz-benchmark:ci because several tests import analysis._data,
          # which transitively imports matplotlib/numpy/scipy (all pinned
          # in the image). Host runner only ships pytest, so a host-side
          # invocation would die with ModuleNotFoundError at collection
          # (this is the regression that broke build #71).
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            sdbkz-benchmark:ci \
            python3 -m pytest tests/ -v

      - name: Smoke-test script imports inside the image
        run: |
          docker run --rm sdbkz-benchmark:ci python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import sweep_parallel
          import sweep_cloud
          import q3329_verify
          import overnight_experiments
          import run_3x_extended
          import run_convergence_test
          print('all script imports OK')
          "

      - name: Run verify.sh with NUM_SEEDS=1 (numerical reproducibility check)
        run: |
          # Regenerate 1 n=50 β=20 reference seed from scratch inside
          # the container (the image has no results/ directory so the
          # existing file will not be found) and compare it against the
          # hardcoded reference value in verify.sh. Tolerance 0.0001 on
          # bkz_final_dln, sdbkz_final_dln, advantage.
          #
          # Why 1 seed not 5: CI is a tripwire that fires on ANY
          # numerical divergence. 1 seed is sufficient to catch every
          # failure mode that matters (Dockerfile rot, import breakage,
          # numerical regression, cross-vendor FP drift). The "5 seeds
          # is more convincing" argument applies to the one-time
          # hash_verification.txt artifact, not to per-commit CI. Saves
          # ~10 minutes of runner time per run.
          docker run --rm -e NUM_SEEDS=1 sdbkz-benchmark:ci bash scripts/verify.sh

      - name: Validate committed seed files (schema + integrity)
        run: |
          # Runs validate_seeds.py in --strict mode against all seed
          # directories committed to the repo. Catches: invalid JSON,
          # missing schema keys, incomplete status, filename/content
          # mismatch, non-finite advantages, within-dataset duplicates,
          # and SHA-256 spot-check against 3 reference seeds.
          # Mount the checkout so committed seed files are visible inside
          # the container. The image only ships scripts/, not results/.
          # Sweep + q3329 + convergence: strict (no known warnings)
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --strict --sha-check \
            results/raw/ results/q3329/ \
            results/convergence/ results/convergence_test/ \
            results/q3329_degenerate/
          # 3x_tours: non-strict (10 known legacy duplicate warnings from
          # original seeds co-existing with extended seeds at same n/beta/seed)
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/validate_seeds.py \
            --sha-check results/3x_tours/

      - name: Figure SHA-256 byte-identity gate (paper-safety invariant)
        run: |
          # Regenerates every paper figure inside the pinned container
          # and compares the output SHA-256 set against the baseline
          # committed at analysis/figures/.sha256. Any non-empty diff
          # means a figure has drifted — either the dataset changed
          # under it or the rendering did. Either is a blocker.
          #
          # Baseline regenerated pre-tag locally; see Makefile `figs`
          # target or CONTRIBUTING "Testing expectations" section.
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            sdbkz-benchmark:ci bash -c "
              mkdir -p /tmp/figs
              python3 analysis/paper_figures.py --output-dir /tmp/figs
              cd /tmp/figs
              sha256sum *.png | sort -k2 > /tmp/actual.sha256
              diff /repo/analysis/figures/.sha256 /tmp/actual.sha256
            "

      - name: Seed manifest lint (v1.3 integrity gate, --sha-check)
        run: |
          # Enforces the three manifest invariants:
          #   (a) no orphan files under results/seeds/ missing from
          #       seed_manifest.json,
          #   (b) no ghost manifest entries pointing at absent files,
          #   (c) on-disk SHA-256 matches the manifest record.
          # --sha-check adds invariant (c). Measured ~0.3s on 4,432
          # entries on this host's NVMe; well within CI budget.
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            sdbkz-benchmark:ci python3 scripts/lint_seed_manifest.py --sha-check

      - name: Diagnostic banner on failure
        if: failure()
        run: |
          echo "::error::Build or verification failed."
          echo ""
          echo "This usually means one of:"
          echo "  - a Dockerfile change broke the build environment"
          echo "  - a Python script change broke imports"
          echo "  - a code change shifted numerical output"
          echo "    (SHA-256 reproducibility regression)"
          echo "  - an apt package revision was garbage-collected"
          echo "    from Debian mirrors"
          echo ""
          echo "Check the earlier job steps for the specific error."
