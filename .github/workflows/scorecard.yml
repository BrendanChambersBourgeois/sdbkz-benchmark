name: OpenSSF Scorecard

# Weekly supply-chain hygiene scan against ~18 OSSF security checks.
# Output goes to:
#   1. GitHub Security tab (SARIF) — alerts surface like CodeQL findings
#   2. Public viewer at securityscorecards.dev/viewer/?uri=github.com/...
#
# Note on action pinning: Scorecard's own "Pinned-Dependencies" check
# will flag the semver tags below and recommend exact commit SHAs in
# its first report. Re-pin to those SHAs in a follow-up commit once
# the first scan lands — verified hashes from the scan output beat
# guessed ones from the editor.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
