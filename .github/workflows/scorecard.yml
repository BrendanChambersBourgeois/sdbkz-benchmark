name: OpenSSF Scorecard

# Weekly supply-chain hygiene scan against ~18 OSSF security checks.
# Output goes to:
#   1. GitHub Security tab (SARIF) — alerts surface like CodeQL findings
#   2. Public viewer at securityscorecards.dev/viewer/?uri=github.com/...
#
# Action pinning: third-party actions pinned to commit SHAs (Scorecard
# Pinned-Dependencies check). When bumping, refresh the SHA via
# `gh api repos/<owner>/<repo>/git/refs/tags/<tag>` and update the
# trailing `# vN` comment.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          sarif_file: results.sarif
