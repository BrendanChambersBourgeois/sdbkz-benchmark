name: OpenSSF Scorecard

# Weekly supply-chain hygiene scan against ~18 OSSF security checks.
# Output goes to:
#   1. GitHub Security tab (SARIF) — alerts surface like CodeQL findings
#   2. Public viewer at securityscorecards.dev/viewer/?uri=github.com/...
#
# Action pinning: third-party actions pinned to commit SHAs (Scorecard
# Pinned-Dependencies check). When bumping, refresh the SHA via
# `gh api repos/<owner>/<repo>/git/refs/tags/<tag>` and update the
# trailing `# vN` comment.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: results.sarif
